services:
  app:
    build:
      context: .
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
